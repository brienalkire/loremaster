name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Only what the tests import. The tests never load main.py, so they
      # don't need anthropic, Pillow, or voxport (which pulls in torch,
      # about 2 GB). py-cord comes from the same pinned commit the bot uses.
      - name: Install test dependencies
        shell: bash
        run: |
          grep -E '^(py-cord|python-dotenv|requests|webrtcvad-wheels)' bot/requirements.txt > ci-requirements.txt
          cat ci-requirements.txt
          python -m pip install -r ci-requirements.txt numpy -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes bot tests
      - name: Test
        run: python -m pytest -rs
